{% extends "base.html" %}

{% block title %}Login - Codes{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-lg-6 col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white py-3">
                <h4 class="mb-0"><i class="bi bi-key"></i> Secure Key Login</h4>
            </div>
            <div class="card-body">
                <p class="text-muted">Use the access key generated by your administrator to enter the platform.</p>
                <form method="POST">
                    <div class="mb-3">
                        <label for="login_key" class="form-label">Login Key</label>
                        <input type="text" class="form-control" id="login_key" name="login_key" 
                               placeholder="Enter your unique login key" required>
                        <div class="form-text">
                            Your login key was provided by the administrator
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right"></i> Login
                    </button>
                </form>
            </div>
        </div>
        
        <div class="alert alert-info mt-3 app-alert">
            <i class="bi bi-info-circle"></i> 
            New users can only be created by the administrator
        </div>
    </div>
</div>
{% endblock %}
