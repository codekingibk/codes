services:
  - type: web
    name: codes-web
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: codes-db
          property: connectionString
      - key: ENABLE_SELF_PING
        value: "true"
      - key: SELF_PING_INTERVAL_SECONDS
        value: "600"

databases:
  - name: codes-db
    plan: free
    region: oregon
